<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Roundtable</title>
    <meta name="description" content="A shared AI roundtable with Gemini, Grok, ChatGPT, and you.">
    <meta property="og:title" content="AI Roundtable">
    <meta property="og:description" content="Gemini, Grok, ChatGPT, and you in one shared transcript.">
    <meta property="og:image" content="https://multi-model-roundtable.onrender.com/assets/ai-roundtable-share.png">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://multi-model-roundtable.onrender.com/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="AI Roundtable">
    <meta name="twitter:description" content="Gemini, Grok, ChatGPT, and you in one shared transcript.">
    <meta name="twitter:image" content="https://multi-model-roundtable.onrender.com/assets/ai-roundtable-share.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon-512.png">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <section id="gate" class="gate" hidden>
      <form id="loginForm" class="gate-form">
        <p class="eyebrow">Private roundtable</p>
        <h1>Enter the room</h1>
        <p class="gate-copy">This public-ready build is protected so model calls stay intentional.</p>
        <input id="password" type="password" autocomplete="current-password" placeholder="Password">
        <button type="submit">Unlock</button>
        <p id="loginError" class="error-text" role="alert"></p>
      </form>
    </section>

    <main class="shell">
      <aside class="sidebar" aria-label="Roundtable controls">
        <div class="brand-block">
          <img class="brand-logo" src="/assets/ai-roundtable-logo.png" alt="AI Roundtable created by Lacey Blayze">
          <p class="eyebrow">Live roundtable</p>
          <h1>Gemini, Grok, ChatGPT, and you</h1>
        </div>

        <div class="sidebar-main">
          <section class="panel">
            <h2>Turn Order</h2>
            <label><input type="checkbox" value="chatgpt" checked> ChatGPT</label>
            <label><input type="checkbox" value="gemini" checked> Gemini</label>
            <label><input type="checkbox" value="grok" checked> Grok</label>
          </section>

          <section class="panel">
            <h2>Status</h2>
            <dl id="status" class="status-list"></dl>
          </section>

          <section class="panel">
            <h2>Usage</h2>
            <dl id="usage" class="status-list"></dl>
          </section>

          <section class="panel admin-panel">
            <h2>Admin</h2>
            <form id="adminLogin" class="admin-login">
              <input id="adminPassword" type="password" autocomplete="current-password" placeholder="Admin password">
              <button type="submit" class="secondary">Unlock admin</button>
            </form>
            <div id="adminControls" class="admin-controls" hidden>
              <label>
                Model turns/hr
                <input id="modelTurnsLimit" type="number" min="1" max="10000">
              </label>
              <label>
                Messages/hr
                <input id="userMessagesLimit" type="number" min="1" max="10000">
              </label>
              <label>
                Transcript cap
                <input id="transcriptLimit" type="number" min="1" max="10000">
              </label>
              <button id="saveLimits" type="button" class="secondary">Save limits</button>
              <button id="clearTranscript" type="button" class="quiet">Clear transcript</button>
              <button id="clearSessions" type="button" class="quiet">Clear sessions</button>
            </div>
            <p id="adminStatus" class="admin-status"></p>
          </section>
        </div>

        <div class="actions">
          <button id="nextTurn" type="button">Next model turn</button>
          <button id="runRound" type="button" class="secondary">Run one round</button>
          <button id="reset" type="button" class="quiet">Reset</button>
          <button id="logout" type="button" class="quiet">Lock room</button>
          <button id="exportTranscript" type="button" class="secondary export-action">Export transcript</button>
        </div>
      </aside>

      <section class="workspace" aria-label="Shared conversation">
        <div class="conversation-head">
          <div>
            <p class="eyebrow">Shared transcript</p>
            <h2 id="nextSpeaker">Loading...</h2>
          </div>
        </div>

        <div id="messages" class="messages" aria-live="polite"></div>

        <form id="composer" class="composer">
          <div id="attachmentTray" class="attachment-tray" hidden></div>
          <textarea id="messageText" rows="3" placeholder="Talk to the whole room or paste an image..."></textarea>
          <button type="submit">Send as you</button>
        </form>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
